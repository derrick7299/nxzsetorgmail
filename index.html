<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreelanceCuan — Masuk atau Daftar</title>
<style>
  :root{
    --teal: #0f9b8e;
    --teal-dark: #0b7d73;
    --ink: #1a2233;
    --muted: #7c8494;
    --field: #eef1f6;
    --field-border: #dfe4ec;
    --bg-top: #eaf6f4;
    --bg-bottom: #f3f6fb;
    --danger: #d64545;
    --radius: 999px;
    --radius-card: 28px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #e7ecf4 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    color: var(--ink);
  }

  .topbar{
    width:100%;
    display:flex;
    justify-content:center;
    padding-top:36px;
  }
  .brand-pill{
    width:64px;
    height:34px;
    background:var(--teal);
    border-radius: 0 0 20px 20px;
  }
  .brand{
    text-align:center;
    font-size:2.1rem;
    font-weight:800;
    color: var(--teal-dark);
    margin: 14px 0 28px;
    letter-spacing:-0.5px;
  }

  .card{
    width:min(440px, 92vw);
    background:#fff;
    border-radius: var(--radius-card);
    padding: 34px 30px 30px;
    box-shadow: 0 20px 45px rgba(20, 40, 60, 0.10);
    margin-bottom: 40px;
  }

  h1{
    font-size:1.9rem;
    margin:0 0 6px;
    font-weight:800;
    line-height:1.15;
  }
  .subtitle{
    color:var(--muted);
    margin:0 0 26px;
    font-size:1rem;
  }

  label{
    display:block;
    font-weight:600;
    font-size:0.95rem;
    margin-bottom:8px;
  }
  .field-group{ margin-bottom:18px; }

  input[type=text], input[type=email], input[type=password]{
    width:100%;
    padding:16px 20px;
    background: var(--field);
    border: 2px solid transparent;
    border-radius: var(--radius);
    font-size:1rem;
    outline:none;
    transition: border-color .15s ease, background .15s ease;
    color:var(--ink);
  }
  input::placeholder{ color:#9aa2b1; }
  input:focus{
    border-color: var(--teal);
    background:#fff;
  }
  input.invalid{ border-color: var(--danger); }

  .error-msg{
    color:var(--danger);
    font-size:0.85rem;
    margin-top:6px;
    display:none;
  }
  .error-msg.show{ display:block; }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin: 6px 0 22px;
    font-size:0.95rem;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink);
  }
  .remember input{
    width:19px;height:19px;
    accent-color: var(--teal);
  }
  a.link, .link-btn{
    color: var(--teal-dark);
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    background:none;
    border:none;
    font-size:inherit;
    padding:0;
  }

  button.primary{
    width:100%;
    padding:17px;
    background: var(--teal);
    color:#fff;
    border:none;
    border-radius: var(--radius);
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    transition: background .15s ease, transform .05s ease;
  }
  button.primary:hover{ background: var(--teal-dark); }
  button.primary:active{ transform: scale(0.99); }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--muted);
    margin: 22px 0;
    font-size:0.9rem;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e2e6ee;
  }

  .google-btn{
    width:100%;
    padding:15px;
    border-radius: var(--radius);
    border:2px solid #e2e6ee;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-weight:700;
    font-size:1rem;
    color:var(--ink);
    cursor:pointer;
  }
  .google-btn:hover{ border-color:#c9cfdb; }

  .switch-line{
    text-align:center;
    margin-top:24px;
    color:var(--muted);
    font-size:0.95rem;
  }

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color:#fff;
    padding:14px 22px;
    border-radius:14px;
    font-size:0.95rem;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error{ background: var(--danger); }

  /* Dashboard */
  .dash-card{
    width:min(440px, 92vw);
    background:#fff;
    border-radius: var(--radius-card);
    padding: 40px 30px;
    box-shadow: 0 20px 45px rgba(20, 40, 60, 0.10);
    text-align:center;
  }
  .avatar-circle{
    width:74px;height:74px;
    border-radius:50%;
    background: var(--teal);
    color:#fff;
    font-size:1.8rem;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 0 auto 18px;
  }
  .dash-card h1{ text-align:center; font-size:1.6rem; }
  .dash-email{ color:var(--muted); margin-bottom:26px; }
  .logout-btn{
    width:100%;
    padding:16px;
    background: #fdeeee;
    color: var(--danger);
    border:none;
    border-radius: var(--radius);
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
  }
  .logout-btn:hover{ background:#fbdddd; }

  .hidden{ display:none !important; }

  @media (max-width:400px){
    .card, .dash-card{ padding: 28px 20px 24px; }
    h1{ font-size:1.6rem; }
  }
</style>
</head>
<body>

<div class="topbar"><div class="brand-pill"></div></div>
<div class="brand">FreelanceCuan</div>

<!-- LOGIN CARD -->
<div class="card" id="loginCard">
  <h1>Selamat datang kembali</h1>
  <p class="subtitle">Masuk ke akun FreelanceCuan kamu</p>

  <form id="loginForm" novalidate>
    <div class="field-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="email@contoh.com" autocomplete="email">
      <div class="error-msg" id="loginEmailError"></div>
    </div>
    <div class="field-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password">
      <div class="error-msg" id="loginPasswordError"></div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="rememberMe">
        Ingat saya
      </label>
      <a class="link" id="forgotLink">Lupa password?</a>
    </div>

    <button type="submit" class="primary">Masuk</button>
  </form>

  <div class="divider">atau</div>

  <button class="google-btn" id="googleLoginBtn">
    <span style="font-weight:800; font-size:1.1rem;">
      <span style="color:#4285F4;">G</span><span style="color:#EA4335;">o</span><span style="color:#FBBC05;">o</span><span style="color:#4285F4;">g</span><span style="color:#34A853;">l</span><span style="color:#EA4335;">e</span>
    </span>
    Masuk dengan Google
  </button>

  <p class="switch-line">Belum punya akun? <button class="link-btn" id="goRegister">Daftar sekarang</button></p>
</div>

<!-- REGISTER CARD -->
<div class="card hidden" id="registerCard">
  <h1>Daftar akun baru</h1>
  <p class="subtitle">Bergabung dan mulai kerjakan job</p>

  <form id="registerForm" novalidate>
    <div class="field-group">
      <label for="regName">Nama Lengkap</label>
      <input type="text" id="regName" placeholder="Nama kamu" autocomplete="name">
      <div class="error-msg" id="regNameError"></div>
    </div>
    <div class="field-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="email@contoh.com" autocomplete="email">
      <div class="error-msg" id="regEmailError"></div>
    </div>
    <div class="field-group">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Min. 8 karakter" autocomplete="new-password">
      <div class="error-msg" id="regPasswordError"></div>
    </div>
    <div class="field-group">
      <label for="regPassword2">Konfirmasi Password</label>
      <input type="password" id="regPassword2" placeholder="Ulangi password" autocomplete="new-password">
      <div class="error-msg" id="regPassword2Error"></div>
    </div>

    <button type="submit" class="primary">Daftar Sekarang</button>
  </form>

  <div class="divider">atau</div>

  <button class="google-btn" id="googleRegisterBtn">
    <span style="font-weight:800; font-size:1.1rem;">
      <span style="color:#4285F4;">G</span><span style="color:#EA4335;">o</span><span style="color:#FBBC05;">o</span><span style="color:#4285F4;">g</span><span style="color:#34A853;">l</span><span style="color:#EA4335;">e</span>
    </span>
    Daftar dengan Google
  </button>

  <p class="switch-line">Sudah punya akun? <button class="link-btn" id="goLogin">Masuk di sini</button></p>
</div>

<!-- DASHBOARD (after login) -->
<div class="dash-card hidden" id="dashCard">
  <div class="avatar-circle" id="dashInitial">F</div>
  <h1 id="dashName">Halo!</h1>
  <p class="dash-email" id="dashEmail">email@contoh.com</p>
  <button class="logout-btn" id="logoutBtn">Keluar</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Storage helpers ----------
  const USERS_KEY = 'fc_users';
  const SESSION_KEY = 'fc_session'; // sessionStorage: berlaku untuk tab ini
  const REMEMBER_KEY = 'fc_remember'; // localStorage: tetap login walau browser ditutup

  function getUsers(){
    try{ return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveUsers(users){
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }
  function setSession(email, remember){
    if(remember){
      localStorage.setItem(REMEMBER_KEY, email);
    }
    sessionStorage.setItem(SESSION_KEY, email);
  }
  function clearSession(){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(REMEMBER_KEY);
  }
  function getActiveEmail(){
    return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(REMEMBER_KEY);
  }

  // ---------- UI elements ----------
  const loginCard = document.getElementById('loginCard');
  const registerCard = document.getElementById('registerCard');
  const dashCard = document.getElementById('dashCard');
  const toast = document.getElementById('toast');

  function showToast(msg, isError){
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 2600);
  }

  function showOnly(el){
    [loginCard, registerCard, dashCard].forEach(c => c.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  document.getElementById('goRegister').addEventListener('click', ()=> showOnly(registerCard));
  document.getElementById('goLogin').addEventListener('click', ()=> showOnly(loginCard));

  function setError(inputId, errorId, msg){
    const input = document.getElementById(inputId);
    const err = document.getElementById(errorId);
    if(msg){
      input.classList.add('invalid');
      err.textContent = msg;
      err.classList.add('show');
    } else {
      input.classList.remove('invalid');
      err.textContent = '';
      err.classList.remove('show');
    }
  }

  function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  // ---------- Register ----------
  document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass = document.getElementById('regPassword').value;
    const pass2 = document.getElementById('regPassword2').value;

    let ok = true;
    setError('regName','regNameError','');
    setError('regEmail','regEmailError','');
    setError('regPassword','regPasswordError','');
    setError('regPassword2','regPassword2Error','');

    if(!name){ setError('regName','regNameError','Nama tidak boleh kosong'); ok = false; }
    if(!isValidEmail(email)){ setError('regEmail','regEmailError','Format email tidak valid'); ok = false; }
    if(pass.length < 8){ setError('regPassword','regPasswordError','Password minimal 8 karakter'); ok = false; }
    if(pass2 !== pass){ setError('regPassword2','regPassword2Error','Konfirmasi password tidak cocok'); ok = false; }

    if(!ok) return;

    const users = getUsers();
    if(users.some(u => u.email === email)){
      setError('regEmail','regEmailError','Email sudah terdaftar, silakan masuk');
      return;
    }

    users.push({ name, email, password: pass });
    saveUsers(users);
    showToast('Akun berhasil dibuat! Silakan masuk.');
    document.getElementById('registerForm').reset();
    showOnly(loginCard);
    document.getElementById('loginEmail').value = email;
  });

  // ---------- Login ----------
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value;
    const remember = document.getElementById('rememberMe').checked;

    setError('loginEmail','loginEmailError','');
    setError('loginPassword','loginPasswordError','');

    let ok = true;
    if(!isValidEmail(email)){ setError('loginEmail','loginEmailError','Format email tidak valid'); ok = false; }
    if(!pass){ setError('loginPassword','loginPasswordError','Password wajib diisi'); ok = false; }
    if(!ok) return;

    const users = getUsers();
    const user = users.find(u => u.email === email);

    if(!user){
      setError('loginEmail','loginEmailError','Email belum terdaftar');
      return;
    }
    if(user.password !== pass){
      setError('loginPassword','loginPasswordError','Password salah');
      return;
    }

    setSession(email, remember);
    showToast('Berhasil masuk. Selamat datang, ' + user.name + '!');
    window.location.href = 'dashboard.html';
  });

  // Simulasi tombol Google (tidak ada backend OAuth sungguhan di file statis ini)
  document.getElementById('googleLoginBtn').addEventListener('click', ()=>{
    showToast('Login Google butuh backend OAuth — belum tersedia di demo ini.', true);
  });
  document.getElementById('googleRegisterBtn').addEventListener('click', ()=>{
    showToast('Daftar dengan Google butuh backend OAuth — belum tersedia di demo ini.', true);
  });
  document.getElementById('forgotLink').addEventListener('click', ()=>{
    showToast('Fitur reset password belum tersedia di demo ini.', true);
  });

  // ---------- Dashboard ----------
  function enterDashboard(user){
    document.getElementById('dashInitial').textContent = user.name.trim().charAt(0).toUpperCase() || 'U';
    document.getElementById('dashName').textContent = 'Halo, ' + user.name + '!';
    document.getElementById('dashEmail').textContent = user.email;
    showOnly(dashCard);
  }

  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    clearSession();
    showToast('Kamu sudah keluar.');
    showOnly(loginCard);
    document.getElementById('loginForm').reset();
  });

  // ---------- Auto-login kalau sudah pernah login & "ingat saya" aktif ----------
  (function autoLogin(){
    const email = getActiveEmail();
    if(email){
      const user = getUsers().find(u => u.email === email);
      if(user){ enterDashboard(user); return; }
    }
    showOnly(loginCard);
  })();
</script>

</body>
</html>
